<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Closing Pipeline — Estela Living</title>
<link rel="stylesheet" href="assets/styles.css?v=20260804173400">
</head>
<body>

<div class="header">
  <div>
    <h1>Estela Living</h1>
    <div class="subtitle">Closing Pipeline — Digital Forms</div>
  </div>
</div>

<div class="container">
  <div class="card" style="padding: 14px;">
    <input class="search-box" id="search" type="text" placeholder="Search address, buyer, or lot number…">

    <button type="button" class="filter-toggle" id="filterToggle">
      <span>Filters &amp; Sort</span>
      <span id="filterToggleIcon">▾</span>
    </button>

    <div id="filterPanel" class="filter-panel" style="display:none;">
      <div class="grid-2">
        <div class="field" style="margin-bottom:0;">
          <label>Development</label>
          <select id="filterDev"><option value="">All Developments</option></select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Model</label>
          <select id="filterModel"><option value="">All Models</option></select>
        </div>
      </div>
      <div class="grid-2" style="margin-top:10px;">
        <div class="field" style="margin-bottom:0;">
          <label>Closing Date From</label>
          <input type="date" id="filterDateFrom">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Closing Date To</label>
          <input type="date" id="filterDateTo">
        </div>
      </div>
      <div class="grid-2" style="margin-top:10px;">
        <div class="field" style="margin-bottom:0;">
          <label>Sort By</label>
          <select id="sortBy">
            <option value="settDate">Closing Date</option>
            <option value="address">Address</option>
            <option value="buyer">Buyer Name</option>
            <option value="dev">Development</option>
            <option value="model">Model</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Order</label>
          <select id="sortDir">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:0; margin-top:10px;">
        <label>View</label>
        <select id="viewMode">
          <option value="grouped">Grouped by Closing Date</option>
          <option value="flat">Flat List</option>
        </select>
      </div>
      <button type="button" class="btn btn-secondary" id="clearFiltersBtn" style="margin-top:12px;">Clear Filters</button>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div id="list"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No homes match your search.</div>
</div>

<script src="assets/houses-data.js?v=20260804173400"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/backend.js?v=20260804173400"></script>
<script src="assets/dashboard.js?v=20260804173400"></script>
</body>
</html>
